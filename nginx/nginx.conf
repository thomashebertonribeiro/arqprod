# Reverse proxy principal: termina TLS e roteia /api/* para a API e o resto para o frontend.
# Em dev (http) basta descomentar o bloco "server 80" abaixo e comentar o 443.

server {
    listen 80;
    server_name _;

    # Certbot webroot (descomente após emitir os certificados)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Durante a primeira emissão de certificado, redirecione apenas acme-challenge.
    # Após emitir, troque este bloco pelo redirecionamento 301 para https.
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

